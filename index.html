<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>✨ इंद्रधनुषी कैलकुलेटर ✨</title>
    <style>
        /* ===== CSS START ===== */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(to right, #ff9a9e, #fecfef);
            transition: background 0.5s ease;
        }

        .calculator-container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .theme-switcher {
            margin-bottom: 15px;
            text-align: center;
        }

        .theme-switcher label {
            color: #333;
            font-weight: bold;
        }

        .theme-switcher select {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
        }

        .calculator {
            width: 320px;
        }

        .display-container {
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .history-display {
            font-size: 0.8em;
            color: #555;
            height: 20px;
            text-align: right;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .display {
            width: calc(100% - 20px);
            height: 60px;
            border: none;
            background-color: transparent;
            text-align: right;
            font-size: 2.5em;
            padding: 0 10px;
            color: #2c3e50;
            box-sizing: border-box;
        }

        .display::placeholder {
            color: #7f8c8d;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn {
            background-color: rgba(255, 255, 255, 0.7);
            border: none;
            padding: 20px;
            font-size: 1.5em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
            color: #333;
            user-select: none;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);
        }

        .function {
            background-color: #f39c12;
            color: white;
        }

        .function:hover {
            background-color: #e67e22;
        }

        .operator {
            background-color: #3498db;
            color: white;
        }

        .operator:hover {
            background-color: #2980b9;
        }

        /* विशिष्ट ऑपरेटर रंग */
        button[data-value="+"] {
            background-color: #2ecc71;
        }

        button[data-value="+"]:hover {
            background-color: #27ae60;
        }

        button[data-value="-"] {
            background-color: #e74c3c;
        }

        button[data-value="-"]:hover {
            background-color: #c0392b;
        }

        button[data-value="*"] {
            background-color: #9b59b6;
        }

        button[data-value="*"]:hover {
            background-color: #8e44ad;
        }

        button[data-value="/"] {
            background-color: #1abc9c;
        }

        button[data-value="/"]:hover {
            background-color: #16a085;
        }

        button[data-value="%"] {
            background-color: #f39c12;
        }

        button[data-value="%"]:hover {
            background-color: #e67e22;
        }

        .equals {
            background-color: #2ecc71;
            color: white;
            grid-column: span 1;
        }

        .equals:hover {
            background-color: #27ae60;
        }

        .zero {
            grid-column: span 2;
        }

        /* थीम स्टाइलिंग */
        body.theme-pastel {
            background: linear-gradient(to right, #fad0c4, #ffd1ff);
        }

        body.theme-pastel .btn {
            background-color: #fff0f5;
            color: #a08299;
        }

        body.theme-pastel .function {
            background-color: #ffb3ba;
            color: white;
        }

        body.theme-pastel .operator {
            background-color: #bae1ff;
            color: #597ea2;
        }

        body.theme-pastel .display {
            color: #775a6a;
        }

        body.theme-neon {
            background: #1a1a1a;
        }

        body.theme-neon .calculator-container {
            background-color: rgba(30, 30, 30, 0.8);
            border-color: #00ffff;
        }

        body.theme-neon .display {
            color: #00ffcc;
        }

        body.theme-neon .history-display {
            color: #00ccff;
        }

        body.theme-neon .btn {
            background-color: #333;
            color: #00ffcc;
            border: 1px solid #00ffff;
            box-shadow: 0 0 5px #00ffff;
        }

        body.theme-neon .btn:hover {
            background-color: #444;
            box-shadow: 0 0 10px #00ffff, 0 0 15px #00ffff;
        }

        body.theme-neon .function {
            background-color: #ff00ff;
            color: #111;
            border-color: #ff00ff;
            box-shadow: 0 0 5px #ff00ff;
        }

        body.theme-neon .function:hover {
            box-shadow: 0 0 10px #ff00ff, 0 0 15px #ff00ff;
        }

        body.theme-neon .operator {
            background-color: #00ffff;
            color: #111;
            border-color: #00ffff;
            box-shadow: 0 0 5px #00ffff;
        }

        body.theme-neon .operator:hover {
            box-shadow: 0 0 10px #00ffff, 0 0 15px #00ffff;
        }

        body.theme-neon .theme-switcher label {
            color: #00ffcc;
        }

        body.theme-neon .theme-switcher select {
            background-color: #222;
            color: #00ffcc;
            border-color: #00ffff;
        }

        body.theme-dark {
            background: #2c3e50;
        }

        body.theme-dark .calculator-container {
            background-color: #34495e;
            border-color: #7f8c8d;
        }

        body.theme-dark .display {
            color: #ecf0f1;
        }

        body.theme-dark .history-display {
            color: #bdc3c7;
        }

        body.theme-dark .btn {
            background-color: #4a6278;
            color: #ecf0f1;
        }

        body.theme-dark .btn:hover {
            background-color: #5c7a96;
        }

        body.theme-dark .function {
            background-color: #e67e22;
            color: white;
        }

        body.theme-dark .operator {
            background-color: #2980b9;
            color: white;
        }

        body.theme-dark .theme-switcher label {
            color: #ecf0f1;
        }

        body.theme-dark .theme-switcher select {
            background-color: #4a6278;
            color: #ecf0f1;
            border-color: #7f8c8d;
        }

        .history-panel {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
            color: #333;
        }

        body.theme-neon .history-panel {
            background-color: rgba(0, 255, 255, 0.1);
            color: #00ffcc;
        }

        body.theme-dark .history-panel {
            background-color: rgba(44, 62, 80, 0.7);
            color: #ecf0f1;
        }

        #historyList {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        #historyList li {
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 5px;
        }

        #historyList li:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        .history-buttons {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .history-buttons button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .history-buttons button:hover {
            background-color: #2980b9;
        }

        /* Animation for button press */
        .btn-pressed {
            transform: scale(0.95);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2) inset;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .calculator {
                width: 95vw;
            }
        }
        /* ===== CSS END ===== */
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="theme-switcher">
            <label for="themeSelector">थीम चुनें: </label>
            <select id="themeSelector">
                <option value="default">डिफ़ॉल्ट</option>
                <option value="pastel">पेस्टल</option>
                <option value="neon">नियोन</option>
                <option value="dark">डार्क</option>
            </select>
        </div>

        <div class="calculator">
            <div class="display-container">
                <div id="historyDisplay" class="history-display"></div>
                <input type="text" id="display" class="display" readonly placeholder="0" />
            </div>

            <div class="buttons">
                <button class="btn function" id="clear">C</button>
                <button class="btn function" id="backspace">⌫</button>
                <button class="btn operator" data-value="%">%</button>
                <button class="btn operator" data-value="/">÷</button>

                <button class="btn number" data-value="7">7</button>
                <button class="btn number" data-value="8">8</button>
                <button class="btn number" data-value="9">9</button>
                <button class="btn operator" data-value="*">×</button>

                <button class="btn number" data-value="4">4</button>
                <button class="btn number" data-value="5">5</button>
                <button class="btn number" data-value="6">6</button>
                <button class="btn operator" data-value="-">−</button>

                <button class="btn number" data-value="1">1</button>
                <button class="btn number" data-value="2">2</button>
                <button class="btn number" data-value="3">3</button>
                <button class="btn operator" data-value="+">+</button>

                <button class="btn number zero" data-value="0">0</button>
                <button class="btn number" data-value=".">.</button>
                <button class="btn equals" id="equals">=</button>
            </div>

            <div class="history-panel">
                <ul id="historyList"></ul>
                <div class="history-buttons">
                    <button id="clearHistory">इतिहास साफ़ करें</button>
                    <button id="copyResult">परिणाम कॉपी करें</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const display = document.getElementById('display');
            const historyDisplay = document.getElementById('historyDisplay');
            const buttons = document.querySelectorAll('.btn');
            const clearButton = document.getElementById('clear');
            const equalsButton = document.getElementById('equals');
            const backspaceButton = document.getElementById('backspace');
            const themeSelector = document.getElementById('themeSelector');
            const historyList = document.getElementById('historyList');
            const clearHistoryButton = document.getElementById('clearHistory');
            const copyResultButton = document.getElementById('copyResult');

            let currentInput = '';
            let previousInput = '';
            let operator = null;
            let calculationHistory = [];

            function updateDisplay() {
                display.value = currentInput || '0';
            }

            function updateHistoryDisplay() {
                if (operator) {
                    historyDisplay.textContent = `${previousInput} ${operatorSymbol(operator)}`;
                } else {
                    historyDisplay.textContent = '';
                }
            }

            function operatorSymbol(op) {
                switch (op) {
                    case '*': return '×';
                    case '/': return '÷';
                    default: return op;
                }
            }

            function appendNumber(number) {
                if (number === '.' && currentInput.includes('.')) return;
                if (currentInput === '0' && number !== '.') currentInput = '';
                currentInput += number;
                updateDisplay();
            }

            function chooseOperator(op) {
                if (currentInput === '' && previousInput === '') return;
                if (currentInput === '' && operator) {
                    operator = op;
                    updateHistoryDisplay();
                    return;
                }
                if (previousInput !== '') {
                    calculate();
                }
                operator = op;
                previousInput = currentInput;
                currentInput = '';
                updateHistoryDisplay();
            }

            function calculate() {
                let result;
                const prev = parseFloat(previousInput);
                const current = parseFloat(currentInput);

                if (isNaN(prev) || isNaN(current)) return;

                switch (operator) {
                    case '+':
                        result = prev + current;
                        break;
                    case '-':
                        result = prev - current;
                        break;
                    case '*':
                        result = prev * current;
                        break;
                    case '/':
                        if (current === 0) {
                            display.value = "त्रुटि!";
                            addToHistory(`${previousInput} ${operatorSymbol(operator)} ${currentInput} = त्रुटि!`);
                            currentInput = '';
                            previousInput = '';
                            operator = null;
                            updateHistoryDisplay();
                            return;
                        }
                        result = prev / current;
                        break;
                    case '%':
                        result = (prev / 100) * current;
                        break;
                    default:
                        return;
                }
                addToHistory(`${previousInput} ${operatorSymbol(operator)} ${currentInput} = ${result}`);
                currentInput = result.toString();
                operator = null;
                previousInput = '';
                updateDisplay();
                updateHistoryDisplay();
            }

            function clearAll() {
                currentInput = '';
                previousInput = '';
                operator = null;
                updateDisplay();
                updateHistoryDisplay();
            }

            function backspace() {
                currentInput = currentInput.slice(0, -1);
                updateDisplay();
            }

            function changeTheme(theme) {
                document.body.className = '';
                if (theme !== 'default') {
                    document.body.classList.add(`theme-${theme}`);
                }
                localStorage.setItem('calculatorTheme', theme);
            }

            function loadTheme() {
                const savedTheme = localStorage.getItem('calculatorTheme');
                if (savedTheme) {
                    themeSelector.value = savedTheme;
                    changeTheme(savedTheme);
                }
            }

            function addToHistory(calculation) {
                calculationHistory.unshift(calculation);
                if (calculationHistory.length > 10) {
                    calculationHistory.pop();
                }
                renderHistory();
            }

            function renderHistory() {
                historyList.innerHTML = '';
                calculationHistory.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    li.title = 'इस परिणाम को डिस्प्ले में लाने के लिए क्लिक करें';
                    li.addEventListener('click', () => {
                        const parts = item.split('=');
                        if (parts.length > 1) {
                            currentInput = parts[1].trim();
                            if (currentInput === "त्रुटि!") currentInput = "";
                            operator = null;
                            previousInput = '';
                            updateDisplay();
                            updateHistoryDisplay();
                        }
                    });
                    historyList.appendChild(li);
                });
            }

            function clearStoredHistory() {
                calculationHistory = [];
                renderHistory();
            }

            function copyToClipboard() {
                if (display.value && display.value !== "0" && display.value !== "त्रुटि!") {
                    navigator.clipboard.writeText(display.value)
                        .then(() => {
                            const originalText = copyResultButton.textContent;
                            copyResultButton.textContent = 'कॉपी! 👍';
                            setTimeout(() => {
                                copyResultButton.textContent = originalText;
                            }, 1500);
                        })
                        .catch(err => {
                            console.error('कॉपी करने में विफल: ', err);
                        });
                }
            }

            // इवेंट लिस्टनर्स
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    button.classList.add('btn-pressed');
                    setTimeout(() => button.classList.remove('btn-pressed'), 100);

                    if (button.classList.contains('number')) {
                        appendNumber(button.dataset.value);
                    } else if (button.classList.contains('operator')) {
                        chooseOperator(button.dataset.value);
                    }
                });
            });

            clearButton.addEventListener('click', clearAll);
            equalsButton.addEventListener('click', calculate);
            backspaceButton.addEventListener('click', backspace);
            themeSelector.addEventListener('change', (e) => changeTheme(e.target.value));
            clearHistoryButton.addEventListener('click', clearStoredHistory);
            copyResultButton.addEventListener('click', copyToClipboard);

            // प्रारंभिक लोड
            loadTheme();
            updateDisplay();
            renderHistory();
        });
    </script>
</body>
</html>
